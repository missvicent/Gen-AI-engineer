# What each workshop layer owns. build_layers.py is the only writer of layers/.
# Students open layers/<id>/before and edit the files in `edit`. They never
# see this file.

shipped_complete = ["provenance.py", "release.py", "evidence.py"]

[[layer]]
id = "02-rag"
title = "Workshop 2 — retrieval core"
edit = ["rag.py"]
supply = ["provenance.py"]
first_failure = "test_semantic_search"
command = "uv run pytest -q tests/test_rag.py::test_semantic_search"
meaning = "`RagStore._rank` still raises NotImplementedError. The test asked the store a question and the ranking step is the one you have not written."
hints = [
  "Chunk.id is a UUIDv5 of tenant, source, and ordinal. The words in the chunk are not part of the id, so an edit keeps the id and changes the version.",
  "_rank fuses two arms with RRF: add 1 / (k + rank) for each arm a chunk appears in. k is already named in the file.",
]

[[layer.slice]]
source = "test_rag.py"

[[layer.slice]]
source = "test_retrieval.py"
dest = "test_rag_chunks.py"
keep = [
  "test_a_chunk_id_is_derived_from_where_it_came_from_not_from_when",
  "test_an_edit_keeps_the_id_and_changes_the_version",
  "test_an_unnamed_document_still_deduplicates",
  "test_a_long_document_becomes_several_chunks_that_know_their_offsets",
]

[[layer]]
id = "03-evals"
title = "Workshop 3 — eval suite"
edit = ["evals.py"]
first_failure = "test_the_suite_scores_every_slice"
command = "uv run pytest -q tests/test_evals.py::test_the_suite_scores_every_slice"
meaning = "`run_suite` still raises NotImplementedError. Scoring has not started, so the suite cannot report a slice yet."
hints = [
  "score_row fills faithfulness and context_recall. An abstention row is a string check: if the answer abstains, faithfulness is 1 and the judge is not called.",
  "gate returns a list of problems. A missing required metric is a problem, the same as a score under the bar.",
]

[[layer.slice]]
source = "test_evals.py"
drop = [
  "test_the_audit_trail_reads_back_as_a_trajectory",
  "test_tool_choice_f1_flags_a_run_that_used_the_wrong_tool",
  "test_goal_completion_reads_receipts_off_the_final_answer",
  "test_a_gated_tool_never_fires_without_approval_even_when_the_brain_insists",
  "test_containment_passes_an_approved_firing_and_names_nothing",
]

[[layer]]
id = "04-agent"
title = "Workshop 4 — agent loop"
edit = ["tools.py", "agent.py"]
first_failure = "test_readonly_tool_runs_and_finishes"
command = "uv run pytest -q tests/test_agent.py::test_readonly_tool_runs_and_finishes"
meaning = "The loop in `agent.run` still raises NotImplementedError. A read-only tool never gets to run."
hints = [
  "Register tools with tool(fn, *, requires_approval=...), not a decorator. The docstring is what a later planner matches on.",
  "A gated tool appends a pending step and stops. It must not call the function until the same step comes back with approval.",
]

[[layer.slice]]
source = "test_agent.py"

[[layer.slice]]
source = "test_evals.py"
dest = "test_trajectory.py"
keep = [
