[project]
name = "gen-ai-engineer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "instructor>=1.15.4",
    "numpy>=2.5.2",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "rapidfuzz>=3.9,<4",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
integration = [                      
   "ragas>=0.4,<0.5",
   "langchain-community>=0.3.27,<0.4",
]
[tool.pytest.ini_options]
pythonpath = ["workshops/model-bench", "retrieval/hybrid-rerank"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
